; Redux extras: Ubuntu packages tools/extras.py can install on the device over SSH.
; One section per package. Later builders: add a section to offer another package.
;   binary   = program the functional check runs
;   check    = argument that prints a version line without opening a screen
;   default  = 1 to pre-tick the box
;   verified = where it was seen working (empty = not verified on a device)
; Stock already has alsa-utils, network-manager, bluez, evtest, mpv, python3, vim, git, wget:
; they are listed under [stock] for the check only, never installed.

[htop]
binary = htop
check = --version
default = 1
desc = Process viewer; Redux's Apps > Task Monitor runs it
verified = Dale's unit, apt install 2026-11-10, htop 3.0.5

[btop]
binary = btop
check = --version
default = 0
desc = Graphical CPU/RAM/temperature monitor
verified = Dale, earlier StockOS Mod card (cbepx-me issue #300)

[s-tui]
binary = s-tui
check = --version
default = 0
desc = CPU frequency/temperature/stress monitor
verified = Dale, earlier StockOS Mod card (cbepx-me issue #300)

[ncdu]
binary = ncdu
check = -v
default = 0
desc = Disk usage browser
verified =

[tmux]
binary = tmux
check = -V
default = 0
desc = Terminal multiplexer (several shells in one terminal)
verified =

[mc]
binary = mc
check = --version
default = 0
desc = Midnight Commander two-pane file manager
verified =

[stock]
; checked by --check, never installed. ffmpeg is left out: on Dale's unit it fails with a
; libfontconfig symbol error (the StockOS Mod repoints libfontconfig for RetroArch).
binaries = alsamixer speaker-test nmtui nmcli bluetoothctl evtest mpv python3 vim git wget
; no --version flag on these (Dale's unit, 2026-11-13): the check runs them with --help
help_only = alsamixer speaker-test nmtui
