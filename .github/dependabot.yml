# Keeps the GitHub Actions in .github/workflows up to date. Actions are pinned to a commit SHA with the
# version in a comment; Dependabot opens a PR that moves both. Merge only with CI green.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
