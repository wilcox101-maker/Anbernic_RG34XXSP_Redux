# Runs on every push and PR. A red X means: don't review, fix first.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2
        run: sudo apt-get update && sudo apt-get install -y cmake libsdl2-dev
      - name: Hard-rule checks
        run: python3 tools/check_rules.py
      - name: Build desktop (warnings are errors)
        run: |
          cmake -S frontend -B build -DREDUX_PLATFORM=desktop -DCMAKE_C_FLAGS="-Werror"
          cmake --build build
      - name: Build stock platform (host compiler; catches compile errors only)
        run: |
          cmake -S frontend -B build-stock -DREDUX_PLATFORM=stock -DCMAKE_C_FLAGS="-Werror"
          cmake --build build-stock
      - name: Launcher tests
        run: ./build/test_launcher
      - name: Remap tests
        run: |
          if [ -x ./build/test_remap_device ]; then ./build/test_remap_device; fi
      - name: Mock-up exit test (F1)
        run: python3 frontend/tests/check_mockups.py ./build/rg34xxsp-redux

  windows-tools:
    # Host tools must run on Windows with the Python standard library alone.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools compile on Windows
        run: python -m compileall -q tools phase1-stock-tweaks
      - name: Hard-rule checks on Windows
        run: python tools/check_rules.py

  arm64:
    # The device binary. Built inside an emulated arm64 Ubuntu 22.04 container, the same release as
    # the stock rootfs, so glibc and SDL2 match. Download it from the run's "Artifacts" section.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Build aarch64 (REDUX_PLATFORM=stock)
        run: |
          docker run --rm --platform linux/arm64 -v "$PWD":/src -w /src ubuntu:22.04 sh -ec '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends cmake make gcc libc6-dev libsdl2-dev >/dev/null
            cmake -S frontend -B build-arm64 -DREDUX_PLATFORM=stock -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS="-Werror"
            cmake --build build-arm64
            ./build-arm64/test_launcher
            ./build-arm64/test_remap_device
          '
      - name: Check it is an aarch64 ELF
        run: |
          python3 - build-arm64/rg34xxsp-redux <<'PY'
          import sys
          h = open(sys.argv[1], "rb").read(20)
          assert h[:4] == b"\x7fELF" and h[18] == 0xB7, "not an aarch64 ELF"
          print("aarch64 ELF ok")
          PY
          cp build-arm64/rg34xxsp-redux dmenu.bin
      - uses: actions/upload-artifact@v4
        with:
          name: redux-dmenu-bin-aarch64
          path: dmenu.bin
          retention-days: 30
