# Runs on every push and PR. A red X means: don't review, fix first.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2
        # Runner DNS failed on 2026-11-11 and apt hung; bound it and retry.
        timeout-minutes: 8
        run: |
          # The runner resolver failed for every Ubuntu host; the public resolvers that fixed arm64 work here too.
          sudo rm -f /etc/resolv.conf
          printf "nameserver 1.1.1.1\nnameserver 8.8.8.8\n" | sudo tee /etc/resolv.conf >/dev/null
          for i in 1 2 3; do
            sudo apt-get update -qq -o Acquire::Retries=3 -o APT::Update::Error-Mode=any && break
            sleep 15
          done
          sudo apt-get install -y -qq -o Acquire::Retries=3 cmake libsdl2-dev
      - name: Hard-rule checks
        run: python3 tools/check_rules.py
      - name: Build desktop (warnings are errors)
        run: |
          cmake -S frontend -B build -DREDUX_PLATFORM=desktop -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS="-Werror" -DREDUX_BUILD="$(echo "$GITHUB_SHA" | cut -c1-7)"
          cmake --build build
      - name: Build stock platform (host compiler; catches compile errors only)
        run: |
          cmake -S frontend -B build-stock -DREDUX_PLATFORM=stock -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS="-Werror" -DREDUX_BUILD="$(echo "$GITHUB_SHA" | cut -c1-7)"
          cmake --build build-stock
      - name: Launcher tests
        run: ./build/test_launcher
      - name: Wi-Fi tests
        run: ./build/test_wifi
      - name: System Tools tests
        run: ./build/test_sysinfo
      - name: Back-to-stock command test
        run: ./build/test_stockmenu
      - name: Volume tests
        run: ./build/test_volume
      - name: Remap tests
        run: |
          if [ -x ./build/test_remap_device ]; then ./build/test_remap_device; fi
      - name: Boot screen renders from branding/
        run: python3 tools/make_bootlogo.py --out build/bootlogo.bmp
      - uses: actions/upload-artifact@v4
        with:
          name: bootlogo-preview
          path: build/bootlogo.bmp
          retention-days: 30
      - name: Navigation test
        run: ./build/test_ui_nav
      - name: Mock-up exit test (F1)
        run: python3 frontend/tests/check_mockups.py ./build/rg34xxsp-redux

  windows-tools:
    # Host tools must run on Windows with the Python standard library alone.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools compile on Windows
        run: python -m compileall -q tools phase1-stock-tweaks
      - name: Hard-rule checks on Windows
        run: python tools/check_rules.py
      - name: Boot screen renders on Windows
        run: python tools/make_bootlogo.py --out build/bootlogo.bmp

  arm64:
    # The device binary. Built inside an emulated arm64 Ubuntu 22.04 container, the same release as
    # the stock rootfs, so glibc and SDL2 match. Download it from the run's "Artifacts" section.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Build aarch64 (REDUX_PLATFORM=stock)
        # --dns: name resolution inside the container failed on 2026-11-11 for every Ubuntu host,
        # with or without host networking; public resolvers avoid the runner's resolver.
        # Error-Mode=any turns a failed apt fetch into an error so the retry loop retries; if
        # ports.ubuntu.com stays unreachable it falls back to the azure.ports.ubuntu.com mirror.
        # No apostrophes inside the sh -ec '...' script below: one ends the quoted script.
        run: |
          docker run --rm --dns 1.1.1.1 --dns 8.8.8.8 --platform linux/arm64 -e REDUX_SHA=${GITHUB_SHA} -v "$PWD":/src -w /src ubuntu:22.04 sh -ec '
            export DEBIAN_FRONTEND=noninteractive
            ok=0
            for mirror in ports.ubuntu.com azure.ports.ubuntu.com; do
              sed -i "s#http://[a-z.]*ports.ubuntu.com#http://$mirror#" /etc/apt/sources.list
              for i in 1 2; do
                if apt-get update -qq -o Acquire::Retries=3 -o APT::Update::Error-Mode=any; then ok=1; break 2; fi
                sleep 10
              done
            done
            [ $ok = 1 ] || { echo "no Ubuntu ports mirror reachable"; exit 1; }
            apt-get install -y -qq --no-install-recommends -o Acquire::Retries=3 cmake make gcc libc6-dev libsdl2-dev >/dev/null
            cmake -S frontend -B build-arm64 -DREDUX_PLATFORM=stock -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS="-Werror" -DREDUX_BUILD=$(echo $REDUX_SHA | cut -c1-7)
            cmake --build build-arm64
            ./build-arm64/test_launcher
            ./build-arm64/test_remap_device
            ./build-arm64/test_wifi
            ./build-arm64/test_sysinfo
            ./build-arm64/test_stockmenu
            ./build-arm64/test_volume
          '
      - name: Check it is an aarch64 ELF
        run: |
          python3 - build-arm64/rg34xxsp-redux <<'PY'
          import sys
          h = open(sys.argv[1], "rb").read(20)
          assert h[:4] == b"\x7fELF" and h[18] == 0xB7, "not an aarch64 ELF"
          print("aarch64 ELF ok")
          PY
          cp build-arm64/rg34xxsp-redux dmenu.bin
      - uses: actions/upload-artifact@v4
        with:
          name: redux-dmenu-bin-aarch64
          path: dmenu.bin
          retention-days: 30
