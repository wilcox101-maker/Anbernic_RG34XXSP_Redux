; RG34XXSP Redux boot screen: everything a rebuilder may change lives here.
; Read by tools/make_bootlogo.py (Python stdlib, runs on Windows). Colours are RRGGBB.
; To rebrand: edit these values and/or replace mark.pbm, then run
;   python tools/make_bootlogo.py
; See branding/README.md.

[screen]
width = 720
height = 480
background = 101010

[socket]
; the beige PLCC-style socket around the chip
color = 8a7f68
pin_color = c9c9c9
pins_per_side = 9

[chip]
color = 1c1c1c

[label]
; the sticker on the chip
color = c8ceb0
text_color = 1c1c1c

[mark]
; 1-bit PBM (P1 or P4). 1 = ink, drawn in label.text_color.
file = mark.pbm
scale = 1

[text]
; up to 4 lines on the label, under the mark's row
line1 = RG34XXSP REDUX
line2 = Allwinner H700
line3 = 2GB DDR4
; append "v<version>" as a last line (version comes from --version or [text] version)
show_version = yes
version = 0.1-dev
; font: the 8x16 VGA font from frontend/src/font.c, scaled by this factor
font_scale = 3

[output]
file = build/bootlogo.bmp
