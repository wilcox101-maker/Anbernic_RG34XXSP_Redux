<!-- RG34XXSP Redux mark: 12-tooth gear crossed by a lightning bolt, one colour.
     Original artwork for this project (Dale + Claude, 2026-11-11). Licence: CC BY 4.0.
     Replace this file (and mark.pbm) to rebrand; see branding/README.md. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="280" height="280">
  <defs>
    <mask id="gap">
      <rect width="280" height="280" fill="#fff"/>
      <polygon points="196,6 92,150 144,144 84,270 190,116 138,122" fill="#000" stroke="#000" stroke-width="18" stroke-linejoin="miter"/>
    </mask>
  </defs>
  <g mask="url(#gap)" fill="#000">
    <circle cx="140" cy="140" r="66" fill="none" stroke="#000" stroke-width="20"/>
    <g id="tooth"><polygon points="127,68 132,46 148,46 153,68"/></g>
    <use href="#tooth" transform="rotate(30 140 140)"/>
    <use href="#tooth" transform="rotate(60 140 140)"/>
    <use href="#tooth" transform="rotate(90 140 140)"/>
    <use href="#tooth" transform="rotate(120 140 140)"/>
    <use href="#tooth" transform="rotate(150 140 140)"/>
    <use href="#tooth" transform="rotate(180 140 140)"/>
    <use href="#tooth" transform="rotate(210 140 140)"/>
    <use href="#tooth" transform="rotate(240 140 140)"/>
    <use href="#tooth" transform="rotate(270 140 140)"/>
    <use href="#tooth" transform="rotate(300 140 140)"/>
    <use href="#tooth" transform="rotate(330 140 140)"/>
  </g>
  <polygon points="196,6 92,150 144,144 84,270 190,116 138,122" fill="#000"/>
</svg>
